name: Build Minecraft Mod

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Загрузка исходников
        uses: actions/checkout@v4

      - name: Установка Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17' # Если мод для Minecraft 1.20.5 или 1.21+, поменяйте '17' на '21'

      - name: Подготовка совместимого Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Сборка мода
        run: gradle build

      - name: Загрузка готового файла
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar

