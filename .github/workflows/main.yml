name: Build Minecraft Mod

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Загрузка исходников
        uses: actions/checkout@v4

      - name: Установка Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17' # ЗАМЕНИТЕ НА 17 ИЛИ 8, ЕСЛИ НУЖНА ДРУГАЯ ВЕРСИЯ

      - name: Подготовка Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Сборка мода
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew build
          else
            gradle build
          fi

      - name: Загрузка готового файла
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar
